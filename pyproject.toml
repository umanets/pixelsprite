[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelsprite"
version = "0.1.0"
description = "Text -> 16x16 / 24x24 / 32x32 pixel-art sprites with a small autoregressive transformer (EN / RU / UK captions)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Ihor Umanets" }]
keywords = ["pixel-art", "sprites", "text-to-image", "transformer", "autoregressive", "pytorch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Graphics",
]
# Tested with torch 2.11, sentence-transformers 6.3, numpy 2.4, pillow 13.0, safetensors 0.8, huggingface_hub 2.4.
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "pillow>=10.0",
  "safetensors>=0.4",
  "huggingface_hub>=0.23",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
learn = ["pandas>=2.0", "pyarrow>=14", "matplotlib>=3.7", "scikit-learn>=1.3", "scipy>=1.10"]

[project.scripts]
pixelsprite = "pixelsprite.cli:main"
pixelsprite-ui = "pixelsprite.webui.server:main"

[tool.setuptools.packages.find]
include = ["pixelsprite*"]

[tool.setuptools.package-data]
"pixelsprite.webui" = ["index.html"]
